spring.datasource.username=kafka
spring.datasource.password=kafka
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


kafka.server=${spring.embedded.kafka.brokers}
kafka.topic=products-created-events-topic
kafka.group-id=products-created-events
kafka.trusted-packages=br.com.andre.core
kafka.isolation-level=read_committed
kafka.auto-offset-reset=earliest
